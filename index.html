<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vim — Cheatsheet Senior Dev</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="logo">V<span>im</span></div>
  <div class="tagline">Senior Developer Cheatsheet</div>
  <div class="search-wrap">
    <span class="si">⌕</span>
    <input type="text" id="search" placeholder="Rechercher une commande..." oninput="buildGrid()">

</div>

<main class="main">
  <div class="grid" id="grid"></div>
</main>

<footer>sources : vim.rtorr.com &nbsp;·&nbsp; devhints.io/vim &nbsp;·&nbsp; vimhelp.org</footer>

let activeTab = 'all';

function buildGrid() {
  const query = document.getElementById('search').value.toLowerCase().trim();
  const grid = document.getElementById('grid');
  const sections = S.filter(s => activeTab === 'all' || s.cat === activeTab);
  const html = sections.map(sec => {
    const cmds = sec.cmds.filter(c => !query || c.k.toLowerCase().includes(query) || c.d.toLowerCase().includes(query));
    if (!cmds.length) return '';
    return `<div class="card">
      <div class="card-header">
        <span class="dot" style="background:${sec.color}"></span>
        <span class="card-title">${sec.title}</span>
        <span class="cmd-count">${cmds.length}</span>
      </div>
      <div class="cmd-list">
        ${cmds.map(c=>`<div class="cmd-row"><kbd>${c.k}</kbd><span class="desc">${c.d}</span></div>`).join('')}
      </div>
      ${sec.tip && !query ? `<div class="tip">${sec.tip}</div>` : ''}
    </div>`;
  }).join('');
  grid.innerHTML = html || `<div class="no-results">Aucune commande trouvée pour « ${query} »</div>`;
}

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.cat;
  buildGrid();
});

buildGrid();

</body>
