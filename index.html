<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vim — Cheatsheet</title>
  <link rel="shortcut icon" href="vim-logo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stylesheet.css">
</head>

<body>

  <header>
    <div class="logo">V<span>im</span></div>
    <div class="tagline">Senior Developer Cheatsheet</div>
    <div class="search-wrap">
      <span class="si">⌕</span>
      <input type="text" id="search" placeholder="Rechercher une commande..." oninput="buildGrid()">
    </div>
  </header>

  <div class="tabs-bar" id="tabs">
    <button class="tab active" data-cat="all">Toutes</button>
    <button class="tab" data-cat="navigation">Navigation</button>
    <button class="tab" data-cat="edition">Édition</button>
    <button class="tab" data-cat="recherche">Recherche</button>
    <button class="tab" data-cat="visual">Mode Visuel</button>
    <button class="tab" data-cat="macros">Macros</button>
    <button class="tab" data-cat="registres">Registres</button>
    <button class="tab" data-cat="fenetres">Fenêtres</button>
    <button class="tab" data-cat="fichiers">Fichiers</button>
  </div>

  <main class="main">
    <div class="grid" id="grid"></div>
  </main>

  <footer>Vim cheatsheet &nbsp;</footer>

  <script src="index.js"></script>
</body>
</html>
